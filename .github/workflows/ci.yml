name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          if [ -n "$(go list ./... 2>/dev/null)" ]; then
            go vet ./...
          else
            echo "no packages yet, skipping"
          fi
      - name: Test
        run: |
          if [ -n "$(go list ./... 2>/dev/null)" ]; then
            go test ./...
          else
            echo "no packages yet, skipping"
          fi
      - name: Boundaries
        run: ./scripts/check-boundaries.sh
