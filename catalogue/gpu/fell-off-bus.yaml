id: gpu.fell-off-bus
layer: gpu
title: GPU inaccessible over PCIe
summary: >
  The driver attempts to reach the GPU over PCIe and finds it gone. It stays
  visible in PCIe enumeration out of band, so the card is physically seated, but
  disappears from the driver in band. Usually a PCIe link hardware failure.
verified: false

preconditions:
  - host.physical_state == on
  - gpu.present

parameters:
  recoverable: {type: bool, default: false, doc: whether a host reset restores the device}

lifecycle: {onset: instant, duration: until_host_reset, self_heals: false}

symptoms:
  redfish:
    - Processors/{gpu} present, Status.Health = Critical
    - PCIeDevices/{gpu} present
  agent.stack:
    - gpu absent from device list
  agent.metrics:
    - DCGM_FI_DEV_XID_ERRORS = 79
    - per-GPU series for {gpu} stop being emitted

detected_by: {domain: gpu, test_class: sanity}
expected_response: quarantine

citation:
  url: https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html
  kind: vendor_doc
  quote: >
    Logged when the GPU driver attempts to access the GPU over its PCI Express
    connection and finds that the GPU is not accessible.
