id: gpu.nvlink-error
layer: gpu
title: NVLink error
summary: >
  XID 74. A problem on the link from this GPU to another GPU or an NVSwitch.
  Matters here because a deployment must fit inside one NVLink domain, so a
  degraded link shrinks the placeable capacity of the host without any GPU
  appearing unhealthy on its own.
verified: false

preconditions:
  - host.physical_state == on
  - gpu.present
  - gpu.nvlink_peers > 0

parameters:
  peer: {type: string, default: auto, doc: the GPU or switch at the far end}
  link_down: {type: bool, default: true}

lifecycle: {onset: instant, duration: until_host_reset, self_heals: false}

symptoms:
  redfish:
    - Processors/{gpu} Status.Health = Warning
  agent.stack:
    - nvlink peer {peer} reports link down
  agent.metrics:
    - DCGM_FI_DEV_XID_ERRORS = 74
    - NVLink bandwidth to {peer} drops to zero

detected_by: {domain: gpu, test_class: performance}
expected_response: drain

citation:
  url: https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html
  kind: vendor_doc
  quote: >
    Logged when the GPU detects that a problem with a connection from the GPU to
    another GPU or NVSwitch over NVLink.
